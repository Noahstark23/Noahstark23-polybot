# ==========================================================
# POLYBOT — docker-compose.yml  (deploy en Coolify, mismo droplet que Kalshi)
# Contenedor, volúmenes, puerto y secret AISLADOS del bot Kalshi.
# ==========================================================
services:
  polybot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polybot
    restart: unless-stopped

    # Health :8080 dentro del contenedor -> :18081 en el host (18080 lo usa Kalshi)
    ports:
      - "18081:8080"

    env_file:
      - .env

    # Volúmenes persistentes PROPIOS (no compartidos con Kalshi)
    volumes:
      - polybot_data:/app/data
      - polybot_logs:/app/logs
      - polybot_secrets:/app/secrets:ro     # wallet key montada solo-lectura

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

    # Límites para que Polybot NO pueda ahogar al contenedor Kalshi (mismo hardware)
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  polybot_data:
  polybot_logs:
  polybot_secrets:
